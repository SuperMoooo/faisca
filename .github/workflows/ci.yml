name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run it makes stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (format, lint, types, boundaries, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        # --locked: fail if uv.lock is out of date instead of silently re-resolving.
        run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - name: Module boundaries
        # Fails when a module imports another module's internals instead of its public.py.
        run: uv run lint-imports
      - run: uv run pytest
      - name: API contract is up to date
        # The web types and the future Flutter client come from contracts/openapi.json.
        run: uv run python scripts/export_openapi.py && git diff --exit-code ../contracts/openapi.json

  web:
    name: Web (types, lint, static export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Types match the API contract
        run: npm run generate:api && git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag faisca:ci .
